services:
  - type: web
    name: company-enrichment-api
    env: python
    region: oregon
    rootDir: backend
    buildCommand: |
      apt-get update &&
      apt-get install -y libnss3 libnspr4 libatk1.0-0 libatk-bridge2.0-0 libcups2 libdrm2 libdbus-1-3 libxkbcommon0 libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libgbm1 libasound2 libatspi2.0-0 libxshmfence1 &&
      pip install -r requirements.txt &&
      playwright install chromium
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: USE_SGPBUSINESS
        value: hybrid
      - key: SERPAPI_KEY
        sync: false
      - key: BING_SEARCH_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
