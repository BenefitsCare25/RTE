services:
  - type: web
    name: company-enrichment-api
    env: docker
    region: oregon
    plan: standard  # Required for Playwright memory requirements
    rootDir: backend
    dockerfilePath: ./Dockerfile
    envVars:
      - key: SERPAPI_KEY
        sync: false
      - key: BING_SEARCH_KEY
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: ENVIRONMENT
        value: production
      - key: FLARESOLVERR_URL
        sync: false
      - key: WEB_MEMORY
        value: 2048  # 2GB memory limit for Playwright
