[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:flaresolverr]
command=/usr/bin/python -u /app/flaresolverr/src/flaresolverr.py
directory=/app/flaresolverr
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/flaresolverr.err.log
stdout_logfile=/var/log/flaresolverr.out.log
environment=LOG_LEVEL="info",LOG_HTML="false",HEADLESS="true",BROWSER_TIMEOUT="60000",TEST_URL="https://www.google.com"

[program:api]
command=uvicorn app.main:app --host 0.0.0.0 --port %(ENV_PORT)s
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/api.err.log
stdout_logfile=/var/log/api.out.log
environment=PORT="%(ENV_PORT)s"
